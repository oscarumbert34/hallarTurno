services:
  postgres:
    image: postgres:16-alpine
    container_name: turnero-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-turnero}
      POSTGRES_USER: ${DB_USERNAME:-turnero}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-turnero}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
