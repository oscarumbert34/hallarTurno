databaseChangeLog:
  - changeSet:
      id: 005-create-service-offerings
      author: turnero
      comment: Create reservable services published by businesses.
      changes:
        - createTable:
            tableName: service_offerings
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_service_offerings
                    nullable: false
              - column:
                  name: business_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: branch_id
                  type: uuid
              - column:
                  name: name
                  type: varchar(160)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: duration_minutes
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  defaultValue: ARS
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: service_offerings
            indexName: idx_service_offerings_business_id
            columns:
              - column:
                  name: business_id
        - createIndex:
            tableName: service_offerings
            indexName: idx_service_offerings_branch_id
            columns:
              - column:
                  name: branch_id
        - createIndex:
            tableName: service_offerings
            indexName: idx_service_offerings_status
            columns:
              - column:
                  name: status
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_offerings ADD CONSTRAINT ck_service_offerings_status CHECK (status IN ('ACTIVE', 'INACTIVE'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_offerings ADD CONSTRAINT ck_service_offerings_duration CHECK (duration_minutes >= 5 AND duration_minutes <= 1440)
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_offerings ADD CONSTRAINT ck_service_offerings_price CHECK (price >= 0)
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_offerings ADD CONSTRAINT ck_service_offerings_currency CHECK (currency ~ '^[A-Z]{3}$')
        - addForeignKeyConstraint:
            baseTableName: service_offerings
            baseColumnNames: business_id
            constraintName: fk_service_offerings_business_id
            referencedTableName: businesses
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: service_offerings
            baseColumnNames: branch_id
            constraintName: fk_service_offerings_branch_id
            referencedTableName: branches
            referencedColumnNames: id
            onDelete: SET NULL
      rollback:
        - dropTable:
            tableName: service_offerings
