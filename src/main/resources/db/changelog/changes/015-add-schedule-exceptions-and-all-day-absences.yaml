databaseChangeLog:
  - changeSet:
      id: 015-add-schedule-exceptions-and-all-day-absences
      author: turnero
      comment: Support all-day resource absences and branch schedule exceptions.
      changes:
        - addColumn:
            tableName: resource_absences
            columns:
              - column:
                  name: all_day
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - dropNotNullConstraint:
            tableName: resource_absences
            columnName: starts_at
            columnDataType: time
        - dropNotNullConstraint:
            tableName: resource_absences
            columnName: ends_at
            columnDataType: time
        - sql:
            sql: ALTER TABLE resource_absences DROP CONSTRAINT ck_resource_absences_time
        - sql:
            sql: ALTER TABLE resource_absences ADD CONSTRAINT ck_resource_absences_values CHECK ((all_day AND starts_at IS NULL AND ends_at IS NULL) OR (NOT all_day AND starts_at IS NOT NULL AND ends_at IS NOT NULL AND starts_at < ends_at))
        - createTable:
            tableName: branch_schedule_exceptions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: exception_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: time
              - column:
                  name: end_time
                  type: time
              - column:
                  name: reason
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: branch_schedule_exceptions
            columnNames: branch_id, exception_date
            constraintName: uk_branch_schedule_exception_date
        - addForeignKeyConstraint:
            baseTableName: branch_schedule_exceptions
            baseColumnNames: branch_id
            referencedTableName: branches
            referencedColumnNames: id
            constraintName: fk_branch_schedule_exceptions_branch
            onDelete: CASCADE
        - createIndex:
            tableName: branch_schedule_exceptions
            indexName: idx_branch_schedule_exceptions_branch_date
            columns:
              - column:
                  name: branch_id
              - column:
                  name: exception_date
        - sql:
            sql: ALTER TABLE branch_schedule_exceptions ADD CONSTRAINT ck_branch_schedule_exception_type CHECK (type IN ('CLOSED', 'CUSTOM_HOURS'))
        - sql:
            sql: ALTER TABLE branch_schedule_exceptions ADD CONSTRAINT ck_branch_schedule_exception_values CHECK ((type = 'CLOSED' AND start_time IS NULL AND end_time IS NULL) OR (type = 'CUSTOM_HOURS' AND start_time IS NOT NULL AND end_time IS NOT NULL AND start_time < end_time))
