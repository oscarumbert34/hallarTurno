spring:
  application:
    name: turnero
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  jackson:
    time-zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      connection-init-sql: SET TIME ZONE 'UTC'

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true

info:
  app:
    name: turnero
    description: Backend Turnero
    version: 0.0.2-SNAPSHOT

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

jwt:
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}

business:
  initial-status: ${BUSINESS_INITIAL_STATUS:ACTIVE}

booking:
  reminders:
    enabled: ${BOOKING_REMINDERS_ENABLED:true}
    cron: "${BOOKING_REMINDERS_CRON:0 0 18,21 * * *}"
    zone-id: ${BOOKING_REMINDERS_ZONE_ID:America/Argentina/Buenos_Aires}
    target-days-offset: ${BOOKING_REMINDERS_TARGET_DAYS_OFFSET:1}
    minimum-hours-before-start: ${BOOKING_REMINDERS_MINIMUM_HOURS_BEFORE_START:12}

brevo:
  api-key: ${BREVO_API_KEY:}
  from-email: ${BREVO_FROM_EMAIL:}
  from-name: ${BREVO_FROM_NAME:HallarTurno}
  base-url: ${BREVO_BASE_URL:https://api.brevo.com}

availability:
  default-zone-id: ${AVAILABILITY_DEFAULT_ZONE_ID:America/Argentina/Buenos_Aires}
  slot-granularity-minutes: ${AVAILABILITY_SLOT_GRANULARITY_MINUTES:15}

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
      exposed-headers: ${CORS_EXPOSED_HEADERS:Location}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
